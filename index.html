<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diversion Risk Scorer</title>
<meta name="description" content="Scores 205 states on the risk that arms exported to them are diverted, following Criterion 7 of the EU Common Position on arms exports. Adjustable weights, map, table and neighbour graph.">
<meta name="author" content="Thomas Di Domenico">
<link rel="stylesheet" href="assets/fonts.css">
<style>
/* Layout: object-explorer workstation — navbar; left = Objects/Model sidebar; centre = Map/Table/Graph workspace; right = object view. Single dark theme by design. */
:root{
  color-scheme:dark;
  --bg:#111418; --s1:#1c2127; --s2:#252a31; --s3:#2f343c; --line:#2f353d; --line2:#404854;
  --ink:#f6f7f9; --t2:#abb3bf; --t3:#738091;
  --blue:#4c90f0; --blue-d:#2d72d2; --blue-bg:rgba(45,114,210,.18);
  --green:#32a467; --orange:#ec9a3c; --red:#e76a6e; --red-d:#cd4246;
  --c-gov:#4c90f0; --c-conf:#e76a6e; --c-emb:#9881f3; --c-nb:#ec9a3c; --c-att:#62c3a7;
  --lo:#2a3540;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--s1)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.mono{font-family:var(--mono)}
.cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
svg.i{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* app frame */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.nav{display:flex;align-items:center;gap:14px;height:44px;background:var(--s1);border-bottom:1px solid var(--line);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;white-space:nowrap}
.logo b{width:18px;height:18px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.logo b i{width:6px;height:6px;background:var(--ink);border-radius:50%}
.sep{width:1px;height:20px;background:var(--line2)}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--t2);min-width:0;overflow:hidden;white-space:nowrap}
.crumbs span:last-child{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumbs em{font-style:normal;color:var(--t3)}
.omni{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line2);border-radius:3px;padding:0 8px;height:28px;width:min(320px,34vw);color:var(--t3)}
.omni input{background:none;border:0;outline:0;flex:1;min-width:0;width:100%;color:var(--ink);font-size:12.5px}
.omni kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-radius:3px;padding:0 4px;color:var(--t3)}
.snap{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--t2);white-space:nowrap}
.snap i{width:7px;height:7px;border-radius:50%;background:var(--green)}
@media (max-width:760px){.crumbs,.snap,.sep{display:none}.omni{width:auto;flex:1;min-width:0}.omni kbd{display:none}}

.ws{min-width:0;display:grid;grid-template-columns:272px minmax(0,1fr) 360px;min-height:0}
@media (max-width:1180px){.ws{grid-template-columns:248px minmax(0,1fr)}.obj{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:820px){.ws{grid-template-columns:minmax(0,1fr)}.app{height:auto}.side{border-right:0;border-bottom:1px solid var(--line)}}
.col{min-height:0;overflow:auto}
@media (max-width:1180px){.app{height:auto}.col{overflow:visible}}

/* sidebar */
.side{background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column}
.stabs{display:flex;border-bottom:1px solid var(--line)}
.stab{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;color:var(--t2);font-weight:500}
.stab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.facets{padding:10px 12px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.sel{display:flex;gap:6px}
.sel select{flex:1 1 0;width:0;min-width:0;background:var(--s2);border:1px solid var(--line2);border-radius:3px;padding:4px 6px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--s2);border:1px solid var(--line2);border-radius:2px;padding:2px 7px;font-size:11.5px;color:var(--t2)}
.chip[aria-pressed="true"]{background:var(--blue-bg);border-color:var(--blue-d);color:var(--ink)}
.list{flex:1;overflow:auto}
@media (max-width:820px){.list{max-height:320px}}
.li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px;padding:5px 12px;border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.li:hover{background:var(--s2)}
.li.on{background:var(--blue-bg);box-shadow:inset 2px 0 0 var(--blue)}
.li .r{font-family:var(--mono);font-size:11px;color:var(--t3);text-align:right}
.li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .n small{display:block;font-family:var(--mono);font-size:10px;color:var(--t3)}
.tagv{font-family:var(--mono);font-size:11.5px;font-weight:500;padding:1px 6px;border-radius:2px;min-width:38px;text-align:center}
.lcount{padding:8px 12px;border-top:1px solid var(--line)}

.model{padding:4px 0}
.w{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:5px}
.w label{display:flex;justify-content:space-between;align-items:center;font-weight:500}
.w label span{display:flex;align-items:center;gap:7px}
.sw{width:8px;height:8px;border-radius:1px;flex:none}
.w output{font-family:var(--mono);font-size:12px;color:var(--blue)}
.w small{font-size:11px;color:var(--t3)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:var(--s3)}
input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:var(--s3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 1px rgba(17,20,24,.6)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:3px;background:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--s3);border:1px solid var(--line2);border-radius:3px;padding:4px 10px;font-size:12px}
.btn:hover{background:#383e47}
.mfoot{padding:12px;display:grid;gap:8px}
.mfoot p{margin:0;font-size:11.5px;color:var(--t3)}

/* centre */
.main{display:flex;flex-direction:column;min-width:0}
.mtabs{display:flex;align-items:center;gap:2px;padding:0 12px;height:38px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:2;overflow-x:auto}
.mtab{display:flex;align-items:center;gap:6px;background:none;border:0;border-radius:3px;padding:5px 10px;color:var(--t2);white-space:nowrap}
.mtab:hover{background:var(--s2);color:var(--ink)}
.mtab[aria-selected="true"]{background:var(--s3);color:var(--ink)}
.mtabs .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.seg{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{background:var(--s1);border:0;padding:3px 9px;font-size:11.5px;color:var(--t2)}
.seg button[aria-pressed="true"]{background:var(--blue-d);color:#fff}
.pane{padding:12px;display:grid;gap:12px;align-content:start}
.card{background:var(--s1);border:1px solid var(--line);border-radius:3px;min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.ch h3{margin:0;font-size:12.5px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--s1);padding:10px 12px;display:grid;gap:2px}
.kpi b{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:-.02em}
.kpi small{font-size:11px;color:var(--t3)}
.map{position:relative;aspect-ratio:2.05/1;max-width:100%}
.map svg{display:block;width:100%;height:100%}
.map path.c{stroke:var(--bg);stroke-width:.35;cursor:pointer}
.map path.c:hover{stroke:var(--ink);stroke-width:.7}
.map path.nb{stroke:var(--blue);stroke-width:.7;stroke-dasharray:2 1.5}
.map path.sel{stroke:#fff;stroke-width:1.3}
.map path.nod{fill:#1a1f25;cursor:default}
.map .grat{fill:none;stroke:#1a2027;stroke-width:.5}
.tip{position:absolute;pointer-events:none;z-index:3;background:var(--s3);border:1px solid var(--line2);border-radius:3px;padding:5px 8px;font-size:12px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));box-shadow:0 4px 12px rgba(0,0,0,.4)}
.ramp{display:flex;align-items:center;gap:6px}
.ramp i{width:110px;height:6px;border-radius:1px;background:linear-gradient(90deg,var(--lo),var(--orange),var(--red-d))}
.hist svg{display:block;width:100%;height:auto}

.tbl{overflow:auto;max-height:calc(100vh - 160px)}
@media (max-width:1180px){.tbl{max-height:600px}}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:12.5px}
th,td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--s2);font-weight:600;font-size:11.5px;color:var(--t2);cursor:pointer;z-index:1}
th:hover{color:var(--ink)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
tbody tr:hover{background:var(--s2)}
tbody tr.on{background:var(--blue-bg)}
.bars{display:flex;width:140px;height:8px;background:var(--bg);gap:1px}
.bars i{display:block;height:100%}
.pill{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:2px;background:var(--s3);color:var(--t2)}
.pill.r{background:rgba(231,106,110,.16);color:var(--red)}
.pill.v{background:rgba(152,129,243,.16);color:var(--c-emb)}
.pill.g{background:rgba(50,164,103,.16);color:var(--green)}
.d{font-family:var(--mono);font-size:10.5px}
.up{color:var(--red)} .dn{color:var(--green)}

.graph svg{display:block;width:100%;height:auto}
.graph .node{cursor:pointer}
.graph .node:hover circle{stroke:#fff}

/* object view */
.obj{background:var(--s1);border-left:1px solid var(--line)}
.oh{padding:14px 14px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.otype{display:flex;align-items:center;gap:6px;color:var(--t3)}
.oh h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.oid{font-family:var(--mono);font-size:11px;color:var(--t3)}
.ostat{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.big{font-family:var(--mono);font-size:38px;font-weight:500;letter-spacing:-.04em;line-height:1}
.lvl{display:inline-flex;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px}
.sec{border-bottom:1px solid var(--line)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;font-weight:600;font-size:12px;background:var(--s2);border-bottom:1px solid var(--line)}
.props{display:grid;grid-template-columns:132px minmax(0,1fr)}
.props div{padding:6px 14px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12.5px;min-width:0}
.props div:nth-child(odd){color:var(--t3);padding-right:4px}
.lin{padding:10px 14px;display:grid;gap:9px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;font-size:12.5px}
.ln .src{font-family:var(--mono);font-size:10px;color:var(--t3)}
.ln .tr{grid-column:1 / -1;height:4px;background:var(--bg);border-radius:1px}
.ln .tr i{display:block;height:100%;border-radius:1px}
.ln em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--t2);text-align:right}
.rr{position:relative;height:18px;margin:4px 14px 2px}
.rr .t{position:absolute;inset:8px 0 auto;height:2px;background:var(--s3)}
.rr .s{position:absolute;top:5px;height:8px;background:var(--blue-bg);border:1px solid var(--blue-d)}
.rr .p{position:absolute;top:3px;width:2px;height:12px;background:var(--ink)}
.links{display:grid}
.lk{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 14px;border:0;border-bottom:1px solid rgba(255,255,255,.04);background:none;text-align:left;width:100%}
.lk:hover{background:var(--s2)}
.lk span small{display:block;font-size:10.5px;color:var(--t3);font-family:var(--mono)}

.doc{padding:20px 22px;display:grid;gap:14px;max-width:880px}
.doc h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.doc h3{margin:6px 0 0;font-size:13.5px;font-weight:600}
.doc p,.doc li{margin:0;color:var(--t2);max-width:76ch}
.doc b{color:var(--ink)}
.doc ul{margin:0;padding-left:18px;display:grid;gap:6px}
.callout{background:rgba(236,154,60,.1);border:1px solid rgba(236,154,60,.4);border-left:3px solid var(--orange);border-radius:3px;padding:10px 12px}
.callout p{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-globe" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c2 2 2.6 4 2.6 6.5S10 12.5 8 14.5M8 1.5C6 3.5 5.4 5.5 5.4 8S6 12.5 8 14.5"/></symbol>
  <symbol id="i-table" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M1.5 6h13M1.5 9.5h13M6 6v7.5"/></symbol>
  <symbol id="i-graph" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2"/><circle cx="2.5" cy="3" r="1.5"/><circle cx="13.5" cy="3.5" r="1.5"/><circle cx="12.5" cy="13" r="1.5"/><circle cx="3" cy="12.5" r="1.5"/><path d="M6.5 6.7 3.6 4M9.6 6.8l2.7-2.3M9.5 9.4l2 2.5M6.4 9.3 4.2 11.4"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M2.5 8.5 6 12l7.5-8"/></symbol>
  <symbol id="i-doc" viewBox="0 0 16 16"><path d="M3.5 1.5h6l3 3v10h-9z"/><path d="M9.5 1.5v3h3M5.5 8h5M5.5 10.5h5"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 4 4"/></symbol>
  <symbol id="i-flag" viewBox="0 0 16 16"><path d="M3 14.5V2M3 2.5h9l-2 3 2 3H3"/></symbol>
  <symbol id="i-reset" viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2v3h3"/></symbol>
</svg>

<div class="app">
  <header class="nav">
    <div class="logo"><b><i></i></b>Diversion Risk</div>
    <div class="sep"></div>
    <div class="crumbs" id="crumbs"></div>
    <label class="omni"><svg class="i"><use href="#i-search"/></svg><input id="omni" type="search" placeholder="Search states" aria-label="Search states" list="omnilist"><kbd>/</kbd></label>
    <datalist id="omnilist"></datalist>
    <div class="snap"><i></i>Snapshot 2026-10-30</div>
  </header>

  <div class="ws">
    <aside class="side col" aria-label="Explorer">
      <div class="stabs" role="tablist">
        <button class="stab" role="tab" id="st-obj" aria-selected="true" data-s="obj">Objects</button>
        <button class="stab" role="tab" id="st-model" aria-selected="false" data-s="model">Model</button>
      </div>
      <div id="s-obj" style="display:flex;flex-direction:column;min-height:0;flex:1">
        <div class="facets">
          <div class="cap">Risk level</div>
          <div class="chips" id="lvlchips"></div>
          <div class="sel">
            <select id="region" aria-label="Region"><option value="">All regions</option></select>
            <select id="att" aria-label="ATT status"><option value="">ATT: any</option><option value="party">Party</option><option value="signatory">Signatory</option><option value="none">Outside</option></select>
          </div>
        </div>
        <div class="list" id="list"></div>
        <div class="lcount cap" id="lcount"></div>
      </div>
      <div id="s-model" class="model" hidden>
        <div id="weights"></div>
        <div class="mfoot">
          <button class="btn" id="reset" type="button"><svg class="i"><use href="#i-reset"/></svg>Reset to base weights</button>
          <p id="wsum"></p>
        </div>
      </div>
    </aside>

    <main class="main col">
      <nav class="mtabs" role="tablist">
        <button class="mtab" role="tab" id="t-map" data-v="map" aria-selected="true"><svg class="i"><use href="#i-globe"/></svg>Map</button>
        <button class="mtab" role="tab" id="t-table" data-v="table" aria-selected="false"><svg class="i"><use href="#i-table"/></svg>Table</button>
        <button class="mtab" role="tab" id="t-graph" data-v="graph" aria-selected="false"><svg class="i"><use href="#i-graph"/></svg>Link graph</button>
        <button class="mtab" role="tab" id="t-val" data-v="val" aria-selected="false"><svg class="i"><use href="#i-check"/></svg>Validation</button>
        <button class="mtab" role="tab" id="t-method" data-v="method" aria-selected="false"><svg class="i"><use href="#i-doc"/></svg>Method</button>
        <div class="right"><div class="seg" role="group" aria-label="Metric"><button id="m-risk" aria-pressed="true" type="button">Risk</button><button id="m-exp" aria-pressed="false" type="button">Exposure</button></div></div>
      </nav>

      <section class="pane" id="v-map">
        <div class="kpis" id="kpis"></div>
        <div class="card">
          <div class="ch"><h3 id="mapTitle">Diversion risk score</h3><span class="ramp cap"><span>Low</span><i></i><span>High</span></span></div>
          <div class="map" id="map"><div class="tip" id="tip" hidden></div></div>
        </div>
        <div class="card hist">
          <div class="ch"><h3>Distribution</h3><span class="cap" id="histNote"></span></div>
          <div id="hist" style="padding:8px 12px 4px"></div>
        </div>
      </section>

      <section class="pane" id="v-table" hidden>
        <div class="card"><div class="tbl"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div></div>
      </section>

      <section class="pane" id="v-graph" hidden>
        <div class="card graph">
          <div class="ch"><h3 id="graphTitle">Land neighbours</h3><span class="cap">Node size = arms imports · colour = score · click to traverse</span></div>
          <div id="graph" style="padding:6px"></div>
        </div>
      </section>

      <section id="v-val" class="doc" hidden></section>
      <section id="v-method" class="doc" hidden></section>
    </main>

    <aside class="obj col" id="obj" aria-live="polite"></aside>
  </div>
</div>

<script src="assets/d3.min.js"></script>
<script src="assets/topojson-client.min.js"></script>
<script>
  // Load the data files, expose them as the globals the app expects, then start the app.
  (async () => {
    const get = async (p) => { const r = await fetch(p); if (!r.ok) throw new Error(`${p}: ${r.status}`); return r.json(); };
    try {
      [window.DATA, window.TOPO, window.CCN, window.BORDERS] = await Promise.all([
        get('data/derived/scores.json'), get('assets/world-110m.topo.json'),
        get('data/raw/iso_numeric.json'), get('data/raw/borders.json'),
      ]);
      const s = document.createElement('script');
      s.src = 'assets/app.js';
      document.body.appendChild(s);
    } catch (e) {
      console.error('Data failed to load', e);
      document.body.insertAdjacentHTML('afterbegin', '<p style="padding:16px;color:#e76a6e;font-family:sans-serif">The data files failed to load. Open this page through a web server (see README), not as a local file.</p>');
    }
  })();
